name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  # Fast lane: no Qt, no container, runs in seconds on every push
  static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: QML anti-pattern checks
        run: python3 scripts/check_qml.py

      - name: Translation catalogues match the QML and the C++
        run: python3 scripts/check_translations.py

      # The compile-check lane below uses the distribution's Qt, which is newer
      # than the 5.6 Sailfish ships - so it happily accepts calls the device
      # rejects, and the failure surfaces during an RPM build on a tag.
      - name: No Qt APIs newer than 5.6
        run: python3 scripts/check_qt56.py

  # Plain Ubuntu, no Sailfish SDK and no Tesseract: the result structure, the
  # layout queries and the field checksums are deliberately free of anything
  # Sailfish- or OCR-specific, so they can be tested on a machine that could
  # never build the app itself.
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install Qt5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qtbase5-dev qtdeclarative5-dev libqt5sql5-sqlite \
            cmake ninja-build

      - name: Build tests
        run: |
          cmake -S tests -B build-tests -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-tests

      - name: Run tests
        run: QT_QPA_PLATFORM=offscreen ctest --test-dir build-tests --output-on-failure

  # Links the whole app, which the syntax lane below deliberately does not.
  #
  # -fsyntax-only compiles each file alone and never links them, so a function
  # that is declared and called but whose body has been deleted passes every
  # other check here and fails at ld inside the RPM build - on a tag, after the
  # version number is spent. That is exactly how v0.1.18 was lost:
  # sensitiveBoxes() went out with the CSV export it had nothing to do with.
  #
  # Every dependency the CMakeLists wants is packaged for Ubuntu, so this is one
  # container and a real binary at the end of it. Not the cross-compile - that is
  # still the SDK's job on a tag - but every symbol has to resolve.
  link:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install the app's dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qtbase5-dev qtdeclarative5-dev libqt5sql5-sqlite \
            cmake ninja-build g++ pkg-config qttools5-dev-tools \
            libtesseract-dev libleptonica-dev libpoppler-qt5-dev

      - name: Configure and link
        run: |
          cmake -S . -B build-app -G Ninja
          cmake --build build-app
          test -x build-app/harbour-moji

  # The unit tests cover the pure layers only, which means nothing above ever
  # compiles main, the settings or the engine. This does - though only one file
  # at a time, which is why the link lane above exists as well.
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install Qt5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qtbase5-dev qtdeclarative5-dev g++ pkg-config \
            libtesseract-dev libleptonica-dev libpoppler-qt5-dev

      - name: Compile-check src/
        run: bash tests/syntax-check.sh

  # Proves the catalogues are well-formed XML that lrelease accepts. The
  # static lane only compares them to the sources; a malformed one would get
  # that far and then fail inside the RPM build.
  translations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install the linguist tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qttools5-dev-tools

      - name: Compile the catalogues
        run: lrelease translations/*.ts
